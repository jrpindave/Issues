<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<title>Mi Casa · Planificador 3D</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; background: #0b0d10; color: #e7ebef;
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased; overflow: hidden; }
  #app { display: flex; flex-direction: column; height: 100vh; }
  header { display: flex; align-items: center; justify-content: space-between;
    padding: 8px 14px; border-bottom: 1px solid #1c2128; background: rgba(8,9,12,.85); }
  header h1 { font-size: 13px; font-weight: 600; margin: 0; letter-spacing: .3px; }
  header .sub { font-size: 11px; color: #6b7280; margin-left: 8px; }
  .row { display: flex; min-height: 0; flex: 1; }
  #stage { position: relative; flex: 1; min-width: 0; }
  canvas { display: block; }
  #loading { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    font-size: 13px; color: #9aa3ad; background: #0b0d10; z-index: 5; }
  #loading .spin { width: 16px; height: 16px; border: 2px solid #2a2f37; border-top-color: #6ea8fe;
    border-radius: 50%; margin-right: 10px; animation: r .8s linear infinite; }
  @keyframes r { to { transform: rotate(360deg); } }

  aside { width: 320px; flex-shrink: 0; border-left: 1px solid #1c2128; background: rgba(8,9,12,.97);
    display: flex; flex-direction: column; }
  .tabs { display: flex; border-bottom: 1px solid #1c2128; }
  .tabs button { flex: 1; padding: 10px; background: none; border: 0; color: #6b7280;
    font-size: 12px; font-weight: 600; letter-spacing: .3px; cursor: pointer; }
  .tabs button.on { background: #11141a; color: #e7ebef; }
  .panel { flex: 1; min-height: 0; overflow-y: auto; padding: 12px; }
  .panel::-webkit-scrollbar { width: 8px; }
  .panel::-webkit-scrollbar-thumb { background: #2a2f37; border-radius: 8px; }

  .toolbar { position: absolute; top: 12px; left: 12px; display: flex; flex-direction: column; gap: 8px; z-index: 4; }
  .group { display: flex; flex-wrap: wrap; gap: 6px; align-items: center;
    background: rgba(8,9,12,.8); border: 1px solid #1c2128; border-radius: 10px; padding: 6px; backdrop-filter: blur(6px); }
  .group .lbl { font-size: 10px; text-transform: uppercase; letter-spacing: .8px; color: #6b7280; padding: 0 4px; }
  .chip { border: 1px solid #2a2f37; background: rgba(20,22,28,.8); color: #cbd2da;
    font-size: 12px; font-weight: 500; border-radius: 7px; padding: 4px 9px; cursor: pointer; }
  .chip:hover { background: #1b1f27; }
  .chip.on { border-color: rgba(56,132,255,.6); background: rgba(56,132,255,.16); color: #bcd6ff; }

  .secttl { font-size: 10px; text-transform: uppercase; letter-spacing: .8px; color: #6b7280; margin: 0 0 8px; }
  .cat { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .6px; color: #9aa3ad; margin: 14px 0 8px; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  .card { display: flex; flex-direction: column; gap: 4px; text-align: left;
    border: 1px solid #1c2128; background: rgba(17,20,26,.6); border-radius: 8px; padding: 8px; cursor: pointer; }
  .card:hover { border-color: #3a414c; background: rgba(27,31,39,.8); }
  .card .nm { display: flex; align-items: center; gap: 6px; font-size: 12px; color: #dfe3e8; }
  .card .sw { width: 12px; height: 12px; border-radius: 3px; flex: none; }
  .card .dim { font-size: 10px; color: #6b7280; font-variant-numeric: tabular-nums; }
  .hint { font-size: 10px; line-height: 1.5; color: #5b6470; margin-top: 10px; }

  .field { margin-bottom: 14px; }
  .dimrow { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
  .dimrow span { width: 46px; font-size: 12px; color: #9aa3ad; }
  input[type=range] { flex: 1; accent-color: #6ea8fe; }
  input[type=number], input[type=text] { background: #11141a; border: 1px solid #1c2128; color: #e7ebef;
    border-radius: 6px; padding: 4px 6px; font-size: 12px; outline: none; }
  input[type=number] { width: 64px; text-align: right; font-variant-numeric: tabular-nums; }
  input:focus { border-color: #2f6fe0; }
  .rots { display: flex; gap: 6px; margin-top: 6px; }
  .rots button, .lvls button { flex: 1; border: 1px solid #2a2f37; background: #11141a; color: #cbd2da;
    border-radius: 6px; padding: 6px; font-size: 11px; cursor: pointer; }
  .lvls { display: flex; gap: 6px; }
  .lvls button.on { border-color: rgba(56,132,255,.6); background: rgba(56,132,255,.16); color: #bcd6ff; }
  .title-row { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
  .badge { font-size: 10px; font-weight: 500; color: #f2c879; background: rgba(242,200,121,.14); border-radius: 5px; padding: 2px 6px; }
  .actions { display: flex; gap: 8px; margin-top: 16px; }
  .actions button { flex: 1; border-radius: 6px; padding: 7px; font-size: 12px; cursor: pointer; }
  .btn { border: 1px solid #2a2f37; background: #11141a; color: #dfe3e8; }
  .btn:hover { background: #1b1f27; }
  .btn-danger { border: 1px solid rgba(180,40,40,.5); background: rgba(60,18,18,.4); color: #f0a8a8; }
  .empty { font-size: 12px; line-height: 1.6; color: #6b7280; padding: 6px 2px; }
  .toggle-aside { border: 1px solid #2a2f37; background: none; color: #cbd2da; border-radius: 6px; padding: 4px 9px; font-size: 11px; cursor: pointer; }
</style>
</head>
<body>
<div id="app">
  <header>
    <div style="display:flex;align-items:baseline">
      <h1>Mi Casa</h1><span class="sub">Planificador 3D · 2 niveles</span>
    </div>
    <button class="toggle-aside" id="togglePanel">Ocultar panel</button>
  </header>
  <div class="row">
    <div id="stage">
      <div id="loading"><span class="spin"></span>Cargando modelo IFC…</div>
      <div class="toolbar" id="toolbar"></div>
    </div>
    <aside id="aside">
      <div class="tabs">
        <button id="tabLib" class="on">Biblioteca</button>
        <button id="tabInsp">Inspector</button>
      </div>
      <div class="panel" id="panel"></div>
    </aside>
  </div>
</div>

  }
}
</script>

  { type:"closet", label:"Clóset", category:"Equipamiento fijo", width:1.6, depth:0.6, height:2.3, color:"#a99a86", fixture:true },
];
const CATEGORIES = [...new Set(CATALOG.map(t => t.category))];
const byType = t => CATALOG.find(c => c.type === t);
const uid = () => (crypto.randomUUID ? crypto.randomUUID() : Math.random().toString(36).slice(2));

function seedFixtures() {
  const seeds = [
    ["encimera", 1.0, -1.0, 0, 0],
    ["mesa-trabajo", 1.0, -2.1, 0, 0],
    ["despensa-aerea", 3.0, -1.0, 0, 0],
    ["lavadora", 3.1, -2.1, 0, 0],
    ["closet", 1.0, -5.6, Math.PI/2, 1],
    ["closet", 3.2, -5.6, Math.PI/2, 1],
  ];
  return seeds.map(([type, x, z, rot, level]) => {
    const t = byType(type);
    return { id: uid(), type, label: t.label, category: t.category, color: t.color,
      width: t.width, depth: t.depth, height: t.height, x, z, rotationY: rot, level,
      upper: t.upper, fixture: t.fixture };
  });
}

// ───────────────────────── Estado + persistencia ─────────────────────────
const STORE_KEY = "mi-casa-standalone";
const State = {
  items: [], selectedId: null, levels: [], levelVisible: [true, true],
  showGrid: true, planView: false, dropX: 0, dropZ: -3,
};
function load() {
  try {
    const raw = localStorage.getItem(STORE_KEY);
    if (raw) { const s = JSON.parse(raw); if (Array.isArray(s.items)) State.items = s.items;
      if (typeof s.showGrid === "boolean") State.showGrid = s.showGrid; return; }
  } catch (e) {}
  State.items = seedFixtures();
}
function persist() {
  try { localStorage.setItem(STORE_KEY, JSON.stringify({ items: State.items, showGrid: State.showGrid })); } catch (e) {}
}
load();

// ───────────────────────── Three.js base ─────────────────────────────────
const stage = document.getElementById("stage");
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
stage.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color("#0b0d10");
scene.fog = new THREE.Fog("#0b0d10", 40, 95);

const camera = new THREE.PerspectiveCamera(45, 1, 0.05, 500);
camera.position.set(9, 8, 12);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true; controls.dampingFactor = 0.08;
controls.minDistance = 1; controls.maxDistance = 80;
controls.maxPolarAngle = Math.PI / 2 - 0.02;

scene.add(new THREE.HemisphereLight("#dfe7f2", "#2a2620", 0.9));
scene.add(new THREE.AmbientLight("#ffffff", 0.25));
const sun = new THREE.DirectionalLight("#ffffff", 1.7);
sun.position.set(12, 18, 8); sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048); sun.shadow.bias = -0.0001;
sun.shadow.camera.left = -20; sun.shadow.camera.right = 20;
sun.shadow.camera.top = 20; sun.shadow.camera.bottom = -20;
sun.shadow.camera.near = 0.1; sun.shadow.camera.far = 80;
scene.add(sun);
const fill = new THREE.DirectionalLight("#ffffff", 0.4); fill.position.set(-10, 8, -6); scene.add(fill);

let grid = null;
const modelGroup = new THREE.Group(); scene.add(modelGroup);
const furnitureGroup = new THREE.Group(); scene.add(furnitureGroup);

const tcontrols = new TransformControls(camera, renderer.domElement);
tcontrols.setMode("translate");
tcontrols.showY = false;
tcontrols.setTranslationSnap(0.05);
tcontrols.addEventListener("dragging-changed", e => { controls.enabled = !e.value; });
tcontrols.addEventListener("mouseUp", () => {
  const g = selectedObject; if (!g) return;
  const it = State.items.find(i => i.id === State.selectedId);
  if (it) { it.x = g.position.x; it.z = g.position.z; persist(); renderInspector(); }
});
const gizmo = tcontrols.getHelper ? tcontrols.getHelper() : tcontrols;
scene.add(gizmo);

let modelInfo = null;     // { center, size, bbox }
let selectedObject = null;

function resize() {
  const w = stage.clientWidth, h = stage.clientHeight;
  renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix();
}
new ResizeObserver(resize).observe(stage); resize();

renderer.setAnimationLoop(() => { controls.update(); renderer.render(scene, camera); });

// ───────────────────────── Carga IFC ─────────────────────────────────────
function b64ToBytes(b64) {
  const bin = atob(b64); const len = bin.length; const bytes = new Uint8Array(len);
  for (let i = 0; i < len; i++) bytes[i] = bin.charCodeAt(i);
  return bytes;
}

async function loadIFC() {
  const api = new WebIFC.IfcAPI();
  api.SetWasmPath("https://unpkg.com/web-ifc@0.0.69/");
  await api.Init();
  const data = b64ToBytes(IFC_B64);
  const modelID = api.OpenModel(data, { COORDINATE_TO_ORIGIN: true });

  // Storeys
  const sids = api.GetLineIDsWithType(modelID, WebIFC.IFCBUILDINGSTOREY);
  const elevs = [];
  for (let i = 0; i < sids.size(); i++) {
    const l = api.GetLine(modelID, sids.get(i));
    elevs.push(l.Elevation?.value ?? 0);
  }
  elevs.sort((a, b) => a - b);
  const storeyElevs = elevs.length ? elevs : [0];

  const meshes = [];
  const bbox = new THREE.Box3();
  const floorHist = new Map();
  const addFloor = (y, a) => { const k = Math.round(y / 0.05) * 0.05; floorHist.set(k, (floorHist.get(k) || 0) + a); };
  const vv = new THREE.Vector3(), nn = new THREE.Vector3();

  api.StreamAllMeshes(modelID, (flatMesh) => {
    const placed = flatMesh.geometries;
    for (let i = 0; i < placed.size(); i++) {
      const pg = placed.get(i);
      const geom = api.GetGeometry(modelID, pg.geometryExpressID);
      const verts = api.GetVertexArray(geom.GetVertexData(), geom.GetVertexDataSize());
      const indices = api.GetIndexArray(geom.GetIndexData(), geom.GetIndexDataSize());
      const m = new THREE.Matrix4().fromArray(pg.flatTransformation);
      const nm = new THREE.Matrix3().getNormalMatrix(m);

      const vc = verts.length / 6;
      const positions = new Float32Array(vc * 3);
      const normals = new Float32Array(vc * 3);
      let minY = Infinity;
      for (let k = 0; k < vc; k++) {
        vv.set(verts[k*6], verts[k*6+1], verts[k*6+2]).applyMatrix4(m);
        nn.set(verts[k*6+3], verts[k*6+4], verts[k*6+5]).applyMatrix3(nm).normalize();
        positions[k*3]=vv.x; positions[k*3+1]=vv.y; positions[k*3+2]=vv.z;
        normals[k*3]=nn.x; normals[k*3+1]=nn.y; normals[k*3+2]=nn.z;
        if (vv.y < minY) minY = vv.y;
      }
      for (let t = 0; t < indices.length; t += 3) {
        const a=indices[t]*3, b=indices[t+1]*3, c=indices[t+2]*3;
        const ux=positions[b]-positions[a], uy=positions[b+1]-positions[a+1], uz=positions[b+2]-positions[a+2];
        const wx=positions[c]-positions[a], wy=positions[c+1]-positions[a+1], wz=positions[c+2]-positions[a+2];
        const cx=uy*wz-uz*wy, cy=uz*wx-ux*wz, cz=ux*wy-uy*wx;
        const mag=Math.hypot(cx,cy,cz);
        if (mag>0 && Math.abs(cy)/mag>0.9) addFloor((positions[a+1]+positions[b+1]+positions[c+1])/3, 0.5*mag);
      }

      const bg = new THREE.BufferGeometry();
      bg.setAttribute("position", new THREE.BufferAttribute(positions, 3));
      bg.setAttribute("normal", new THREE.BufferAttribute(normals, 3));
      bg.setIndex(new THREE.BufferAttribute(new Uint32Array(indices), 1));
      const col = pg.color;
      const mat = new THREE.MeshStandardMaterial({ color: new THREE.Color(col.x, col.y, col.z),
        opacity: col.w, transparent: col.w < 0.999, side: THREE.DoubleSide, roughness: 0.85, metalness: 0 });
      const mesh = new THREE.Mesh(bg, mat);
      mesh.castShadow = true; mesh.receiveShadow = true;
      meshes.push({ mesh, minY });
      bbox.expandByObject(mesh);
      geom.delete();
    }
  });
  api.CloseModel(modelID);

  const size = bbox.getSize(new THREE.Vector3());
  const groundBandTop = bbox.min.y + size.y * 0.4;
  let groundFloorY = bbox.min.y, best = -1;
  for (const [y, area] of floorHist) if (y <= groundBandTop && area > best) { best = area; groundFloorY = y; }
  const base = storeyElevs[0];
  const levels = storeyElevs.map((e, idx) => ({ index: idx, name: `Nivel ${idx+1}`, elevation: groundFloorY + (e - base) }));
  const spacing = storeyElevs.length > 1 ? storeyElevs[1] - storeyElevs[0] : 2.6;
  const splitY = groundFloorY + spacing / 2;
  for (const { mesh, minY } of meshes) { mesh.userData.level = minY >= splitY ? 1 : 0; modelGroup.add(mesh); }

  const center = bbox.getCenter(new THREE.Vector3());
  State.levels = levels;
  State.levelVisible = levels.map(() => true);
  State.dropX = center.x; State.dropZ = center.z;
  modelInfo = { center, size, bbox };

  // Grid + contact plane on the ground.
  grid = new THREE.GridHelper(80, 160, 0x39414c, 0x1c2128);
  grid.position.set(center.x, bbox.min.y + 0.002, center.z);
  grid.visible = State.showGrid;
  scene.add(grid);

  applyLevelVisibility();
  frameCamera();
  document.getElementById("loading").style.display = "none";
  renderToolbar(); renderFurniture(); renderPanel();
}

function frameCamera() {
  if (!modelInfo) return;
  const { center, size } = modelInfo;
  const r = Math.max(size.x, size.y, size.z);
  if (State.planView) camera.position.set(center.x, center.y + r * 1.6, center.z + 0.001);
  else camera.position.set(center.x + r * 0.9, center.y + r * 0.8, center.z + r * 1.1);
  controls.target.copy(center);
  controls.enableRotate = !State.planView;
  controls.update();
}

function applyLevelVisibility() {
  modelGroup.traverse(o => { if (o.isMesh) { const lvl = o.userData.level ?? 0; o.visible = State.levelVisible[lvl] ?? true; } });
}

// ───────────────────────── Muebles ───────────────────────────────────────
function elevationOf(level) { return State.levels[level]?.elevation ?? 0; }

function buildPiece(item) {
  const g = new THREE.Group();
  g.position.set(item.x, elevationOf(item.level), item.z);
  g.rotation.y = item.rotationY;
  g.userData.itemId = item.id;
  const sel = item.id === State.selectedId;
  const edgeCol = sel ? 0xffd479 : (item.fixture ? 0x000000 : 0x000000);
  const mkBox = (w, h, d, y, op) => {
    const geo = new THREE.BoxGeometry(w, h, d);
    const mat = new THREE.MeshStandardMaterial({ color: new THREE.Color(item.color), roughness: 0.7, metalness: 0.04,
      emissive: new THREE.Color(sel ? 0x3a3320 : 0x000000), emissiveIntensity: sel ? 1 : 0,
      transparent: op < 1, opacity: op });
    const mesh = new THREE.Mesh(geo, mat); mesh.position.y = y; mesh.castShadow = true; mesh.receiveShadow = true;
    g.add(mesh);
    const eg = new THREE.EdgesGeometry(geo, 15);
    const el = new THREE.LineSegments(eg, new THREE.LineBasicMaterial({ color: edgeCol, transparent: true, opacity: sel ? 0.9 : 0.28 }));
    el.position.y = y; g.add(el);
  };
  mkBox(item.width, item.height, item.depth, item.height / 2, item.fixture ? 0.92 : 1);
  if (item.upper) mkBox(item.upper.width ?? item.width, item.upper.height,
      item.upper.depth ?? item.depth, item.upper.topY - item.upper.height / 2, 0.9);
  return g;
}

function renderFurniture() {
  // Detach gizmo before clearing.
  tcontrols.detach(); selectedObject = null;
  for (let i = furnitureGroup.children.length - 1; i >= 0; i--) {
    const c = furnitureGroup.children[i];
    c.traverse(o => { if (o.geometry) o.geometry.dispose(); if (o.material) o.material.dispose?.(); });
    furnitureGroup.remove(c);
  }
  for (const item of State.items) {
    if (!(State.levelVisible[item.level] ?? true)) continue;
    const g = buildPiece(item);
    furnitureGroup.add(g);
    if (item.id === State.selectedId) { selectedObject = g; tcontrols.attach(g); }
  }
}

// ───────────────────────── Selección (raycast) ───────────────────────────
const ray = new THREE.Raycaster();
const ndc = new THREE.Vector2();
renderer.domElement.addEventListener("pointerdown", (e) => {
  if (tcontrols.dragging || tcontrols.axis) return; // interacting with the move gizmo
  const r = renderer.domElement.getBoundingClientRect();
  ndc.x = ((e.clientX - r.left) / r.width) * 2 - 1;
  ndc.y = -((e.clientY - r.top) / r.height) * 2 + 1;
  ray.setFromCamera(ndc, camera);
  const hits = ray.intersectObjects(furnitureGroup.children, true);
  if (hits.length) {
    let o = hits[0].object;
    while (o && o.userData.itemId === undefined) o = o.parent;
    if (o) { selectItem(o.userData.itemId); return; }
  }
  selectItem(null);
});

function selectItem(id) {
  State.selectedId = id;
  renderFurniture();
  if (id) { setTab("insp"); } else { renderInspector(); }
}

// ───────────────────────── UI: Panel + Toolbar ───────────────────────────
let tab = "lib";
let addLevel = 0;
const panel = document.getElementById("panel");
const tabLib = document.getElementById("tabLib");
const tabInsp = document.getElementById("tabInsp");
tabLib.onclick = () => setTab("lib");
tabInsp.onclick = () => setTab("insp");
function setTab(t) { tab = t; tabLib.classList.toggle("on", t === "lib"); tabInsp.classList.toggle("on", t === "insp"); renderPanel(); }

function renderPanel() { tab === "lib" ? renderLibrary() : renderInspector(); }

function levelNames() { return State.levels.length ? State.levels.map(l => l.name) : ["Nivel 1", "Nivel 2"]; }

function renderLibrary() {
  const names = levelNames();
  let html = `<div class="field"><p class="secttl">Agregar al nivel</p><div class="lvls">`;
  names.forEach((n, i) => html += `<button data-al="${i}" class="${addLevel===i?"on":""}">${n}</button>`);
  html += `</div></div>`;
  for (const cat of CATEGORIES) {
    html += `<p class="cat">${cat}</p><div class="grid2">`;
    for (const t of CATALOG.filter(t => t.category === cat)) {
      html += `<button class="card" data-add="${t.type}">
        <span class="nm"><span class="sw" style="background:${t.color}"></span>${t.label}</span>
        <span class="dim">${t.width}×${t.depth}×${t.height} m</span></button>`;
    }
    html += `</div>`;
  }
  html += `<p class="hint">Clic para agregar. Selecciona una pieza en la escena para moverla con el gizmo o editar sus medidas en el Inspector. Tu distribución se guarda automáticamente.</p>`;
  panel.innerHTML = html;
  panel.querySelectorAll("[data-al]").forEach(b => b.onclick = () => { addLevel = +b.dataset.al; renderLibrary(); });
  panel.querySelectorAll("[data-add]").forEach(b => b.onclick = () => addItem(byType(b.dataset.add), addLevel));
}

function addItem(t, level) {
  const j = (State.items.length % 5) * 0.35;
  const item = { id: uid(), type: t.type, label: t.label, category: t.category, color: t.color,
    width: t.width, depth: t.depth, height: t.height, x: State.dropX + j, z: State.dropZ + j,
    rotationY: 0, level, upper: t.upper, fixture: t.fixture };
  State.items.push(item); State.selectedId = item.id; persist();
  renderFurniture(); setTab("insp");
}

function renderInspector() {
  const it = State.items.find(i => i.id === State.selectedId);
  if (!it) { panel.innerHTML = `<p class="empty">Ninguna pieza seleccionada. Haz clic sobre un mueble en la escena para editar sus dimensiones, color, rotación y nivel.</p>`; return; }
  const names = levelNames();
  const deg = Math.round(it.rotationY * 180 / Math.PI);
  panel.innerHTML = `
    <div class="title-row">
      <input type="text" id="lbl" value="${it.label.replace(/"/g,'&quot;')}" style="flex:1" />
      ${it.fixture ? '<span class="badge">fijo</span>' : ''}
    </div>
    <div class="field"><p class="secttl">Dimensiones (m)</p>
      ${dimRow("Ancho","w",it.width)}${dimRow("Fondo","d",it.depth)}${dimRow("Alto","h",it.height)}
    </div>
    <div class="field"><p class="secttl">Rotación</p>
      <div class="dimrow"><input type="range" id="rot" min="0" max="360" step="5" value="${deg}"><span style="width:42px;text-align:right">${deg}°</span></div>
      <div class="rots">${[0,90,180,270].map(d=>`<button data-rot="${d}">${d}°</button>`).join("")}</div>
    </div>
    <div class="field"><p class="secttl">Nivel</p>
      <div class="lvls">${names.map((n,i)=>`<button data-lvl="${i}" class="${it.level===i?"on":""}">${n}</button>`).join("")}</div>
    </div>
    <div class="field"><p class="secttl">Color</p>
      <div class="dimrow"><input type="color" id="col" value="${it.color}" style="width:48px;height:30px;border:1px solid #2a2f37;border-radius:6px;background:none"><span style="color:#6b7280">${it.color}</span></div>
    </div>
    <div class="actions">
      <button class="btn" id="dup">Duplicar</button>
      <button class="btn-danger" id="del">Eliminar</button>
    </div>`;

  const upd = (patch) => { Object.assign(it, patch); persist(); renderFurniture(); };
  panel.querySelector("#lbl").oninput = e => { it.label = e.target.value; persist(); };
  panel.querySelector("#w").oninput = e => syncDim("w", e.target.value, it);
  panel.querySelector("#d").oninput = e => syncDim("d", e.target.value, it);
  panel.querySelector("#h").oninput = e => syncDim("h", e.target.value, it);
  panel.querySelector("#wn").oninput = e => syncDim("w", e.target.value, it);
  panel.querySelector("#dn").oninput = e => syncDim("d", e.target.value, it);
  panel.querySelector("#hn").oninput = e => syncDim("h", e.target.value, it);
  panel.querySelector("#rot").oninput = e => upd({ rotationY: (+e.target.value) * Math.PI / 180 });
  panel.querySelectorAll("[data-rot]").forEach(b => b.onclick = () => { upd({ rotationY: (+b.dataset.rot)*Math.PI/180 }); renderInspector(); });
  panel.querySelectorAll("[data-lvl]").forEach(b => b.onclick = () => { upd({ level: +b.dataset.lvl }); renderInspector(); });
  panel.querySelector("#col").oninput = e => upd({ color: e.target.value });
  panel.querySelector("#dup").onclick = () => duplicateItem(it.id);
  panel.querySelector("#del").onclick = () => removeItem(it.id);
}

function dimRow(label, key, val) {
  return `<div class="dimrow"><span>${label}</span>
    <input type="range" id="${key}" min="0.1" max="4" step="0.05" value="${val}">
    <input type="number" id="${key}n" min="0.05" max="6" step="0.05" value="${val.toFixed(2)}"></div>`;
}
function syncDim(key, raw, it) {
  let v = Math.max(0.05, Math.min(6, parseFloat(raw) || 0.05));
  it[{w:"width",d:"depth",h:"height"}[key]] = v;
  panel.querySelector("#"+key).value = v;
  panel.querySelector("#"+key+"n").value = v.toFixed(2);
  persist(); renderFurniture();
}

function duplicateItem(id) {
  const s = State.items.find(i => i.id === id); if (!s) return;
  const c = { ...s, id: uid(), x: s.x + 0.4, z: s.z + 0.4 };
  State.items.push(c); State.selectedId = c.id; persist(); renderFurniture(); renderInspector();
}
function removeItem(id) {
  State.items = State.items.filter(i => i.id !== id);
  if (State.selectedId === id) State.selectedId = null;
  persist(); renderFurniture(); renderInspector();
}

// Toolbar
const toolbar = document.getElementById("toolbar");
function renderToolbar() {
  const lv = State.levels.length ? State.levels : [{index:0,name:"Nivel 1"},{index:1,name:"Nivel 2"}];
  toolbar.innerHTML = `
    <div class="group"><span class="lbl">Niveles</span>
      ${lv.map(l=>`<button class="chip ${State.levelVisible[l.index]?"on":""}" data-tl="${l.index}">${l.name}</button>`).join("")}
    </div>
    <div class="group">
      <button class="chip ${State.planView?"on":""}" data-plan>${State.planView?"Vista planta":"Vista órbita"}</button>
      <button class="chip ${State.showGrid?"on":""}" data-grid>Grilla</button>
      <button class="chip" data-restore>Restaurar fijos</button>
      <button class="chip" data-clear>Limpiar</button>
    </div>`;
  toolbar.querySelectorAll("[data-tl]").forEach(b => b.onclick = () => {
    const i = +b.dataset.tl; State.levelVisible[i] = !State.levelVisible[i];
    applyLevelVisibility(); renderFurniture(); renderToolbar();
  });
  toolbar.querySelector("[data-plan]").onclick = () => { State.planView = !State.planView; frameCamera(); renderToolbar(); };
  toolbar.querySelector("[data-grid]").onclick = () => { State.showGrid = !State.showGrid; if (grid) grid.visible = State.showGrid; persist(); renderToolbar(); };
  toolbar.querySelector("[data-restore]").onclick = () => {
    State.items = State.items.filter(i => !i.fixture).concat(seedFixtures());
    State.selectedId = null; persist(); renderFurniture(); renderPanel();
  };
  toolbar.querySelector("[data-clear]").onclick = () => {
    State.items = State.items.filter(i => i.fixture); State.selectedId = null;
    persist(); renderFurniture(); renderPanel();
  };
}

document.getElementById("togglePanel").onclick = (e) => {
  const a = document.getElementById("aside");
  const hidden = a.style.display === "none";
  a.style.display = hidden ? "flex" : "none";
  e.target.textContent = hidden ? "Ocultar panel" : "Mostrar panel";
  resize();
};

// ───────────────────────── Init ───────────────────────────────────────────
renderPanel(); renderToolbar();
loadIFC().catch(err => {
  console.error(err);
  document.getElementById("loading").innerHTML =
    "No se pudo cargar el modelo o las librerías 3D.<br>Verifica tu conexión a internet (se usan CDN para Three.js y web-ifc).";
});
</script>
